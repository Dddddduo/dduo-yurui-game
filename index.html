<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>北华大学 · 接接乐 — 欢迎2026级新同学</title>
<style>
  :root {
    --bg: #1a1a2e;
    --accent: #ff6b9d;
    --gold: #f9ca24;
    --safe-bottom: env(safe-area-inset-bottom, 0px);
    --safe-top: env(safe-area-inset-top, 0px);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    width: 100%; height: 100%;
    overflow: hidden;
    background: #1a1025;
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
    touch-action: manipulation;
    -webkit-tap-highlight-color: transparent;
    -webkit-user-select: none;
    user-select: none;
    overscroll-behavior: none;
    position: fixed;
    top: 0; left: 0;
  }

  #game-container {
    position: relative;
    width: 100%; height: 100%;
    max-width: 480px;
    margin: 0 auto;
  }

  canvas { display: block; width: 100%; height: 100%; }

  /* ── HUD ── */
  #hud {
    position: absolute;
    top: 0; left: 0; right: 0;
    padding: 14px 18px;
    padding-top: max(14px, var(--safe-top));
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    pointer-events: none;
    z-index: 10;
  }

  #score-panel {
    display: flex;
    flex-direction: column;
  }

  #score-label {
    font-size: 11px;
    letter-spacing: 2px;
    color: rgba(255,255,255,0.45);
    font-weight: 600;
  }

  #score {
    font-size: 38px;
    font-weight: 900;
    color: #fff;
    line-height: 1;
    transition: transform 0.1s;
  }

  #lives {
    display: flex;
    gap: 5px;
    font-size: 22px;
    margin-top: 4px;
  }
  #lives .hp { transition: transform 0.3s, opacity 0.3s; }
  #lives .hp.lost { opacity: 0.15; transform: scale(0.6); }

  /* ── 计时器 ── */
  #timer-display {
    display: flex;
    flex-direction: column;
    align-items: flex-end;
  }
  #timer-label {
    font-size: 11px;
    letter-spacing: 2px;
    color: rgba(255,255,255,0.45);
    font-weight: 600;
  }
  #timer {
    font-size: 38px;
    font-weight: 900;
    color: #fff;
    line-height: 1;
    transition: color 0.3s;
  }
  #timer.warning { color: #ff4757; animation: timerBlink 0.5s infinite alternate; }
  @keyframes timerBlink { from { opacity: 1; } to { opacity: 0.4; } }

  #timer-bar-container {
    position: absolute;
    bottom: 0; left: 0; right: 0;
    height: 4px;
    background: rgba(255,255,255,0.08);
    z-index: 10;
    pointer-events: none;
  }
  #timer-bar {
    height: 100%;
    background: linear-gradient(90deg, #5dade2, #ff6b9d);
    transition: width 0.3s linear;
    width: 100%;
  }
  #timer-bar.warning { background: linear-gradient(90deg, #ff4757, #ff6b9d); }

  /* Freeze indicator */
  #freeze-indicator {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    font-size: 16px;
    font-weight: 700;
    color: #5dade2;
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.3s;
    text-shadow: 0 0 16px rgba(93,173,226,0.6);
    letter-spacing: 2px;
    z-index: 10;
  }
  #freeze-indicator.active { opacity: 1; }

  /* Combo */
  #combo-display {
    position: absolute;
    bottom: 18%;
    left: 50%;
    transform: translate(-50%, 0);
    font-size: 26px;
    font-weight: 900;
    color: var(--gold);
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.2s, transform 0.2s;
    text-shadow: 0 0 24px rgba(249,202,36,0.55);
    z-index: 10;
  }
  #combo-display.active {
    opacity: 1;
    transform: translate(-50%, -6px);
  }

  /* ── Overlays ── */
  .overlay {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: rgba(26, 16, 37, 0.93);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    z-index: 20;
    padding: 40px 28px;
    padding-bottom: calc(40px + var(--safe-bottom));
    transition: opacity 0.4s, visibility 0.4s;
  }

  .overlay.hidden {
    opacity: 0;
    visibility: hidden;
    pointer-events: none;
  }

  .overlay h1 {
    font-size: 44px;
    font-weight: 900;
    color: #fff;
    margin-bottom: 6px;
    letter-spacing: 2px;
  }

  .overlay .subtitle {
    font-size: 14px;
    color: rgba(255,255,255,0.5);
    margin-bottom: 28px;
    text-align: center;
    line-height: 1.8;
  }

  .overlay .subtitle b { color: #ff6b9d; }
  .overlay .subtitle i { color: #5dade2; font-style: normal; }

  .legend {
    display: flex;
    gap: 16px;
    margin-bottom: 20px;
    font-size: 12px;
    color: rgba(255,255,255,0.5);
  }
  .legend span { display: flex; align-items: center; gap: 4px; }
  .legend .dot {
    display: inline-block;
    width: 10px; height: 10px;
    border-radius: 50%;
  }
  .legend .dot.red  { background: #ff4757; box-shadow: 0 0 6px #ff4757; }
  .legend .dot.gold { background: #f9ca24; box-shadow: 0 0 6px #f9ca24; }
  .legend .dot.blue { background: #5dade2; box-shadow: 0 0 6px #5dade2; }

  .btn {
    display: inline-block;
    padding: 15px 52px;
    font-size: 17px;
    font-weight: 700;
    color: #fff;
    background: linear-gradient(135deg, #ff6b9d, #e94560);
    border: none;
    border-radius: 50px;
    cursor: pointer;
    letter-spacing: 2px;
    transition: transform 0.2s, box-shadow 0.2s;
    box-shadow: 0 8px 28px rgba(233, 69, 96, 0.35);
    -webkit-tap-highlight-color: transparent;
  }

  .btn:active {
    transform: scale(0.93);
    box-shadow: 0 4px 14px rgba(233, 69, 96, 0.25);
  }

  .btn-small {
    display: inline-block;
    padding: 10px 28px;
    font-size: 14px;
    font-weight: 600;
    color: #fff;
    background: rgba(255,255,255,0.12);
    border: 1px solid rgba(255,255,255,0.2);
    border-radius: 50px;
    cursor: pointer;
    letter-spacing: 1px;
    transition: background 0.2s, transform 0.2s;
    -webkit-tap-highlight-color: transparent;
    margin-top: 12px;
  }
  .btn-small:active { background: rgba(255,255,255,0.2); transform: scale(0.95); }

  /* ── 姓名输入 ── */
  .name-input {
    width: 70%;
    max-width: 260px;
    padding: 12px 18px;
    font-size: 18px;
    font-weight: 600;
    color: #fff;
    background: rgba(255,255,255,0.08);
    border: 2px solid rgba(255,255,255,0.2);
    border-radius: 12px;
    text-align: center;
    letter-spacing: 2px;
    outline: none;
    transition: border-color 0.3s;
    font-family: inherit;
    margin-bottom: 16px;
  }
  .name-input:focus { border-color: rgba(255,255,255,0.5); }
  .name-input::placeholder { color: rgba(255,255,255,0.25); }

  .name-hint {
    font-size: 12px;
    color: rgba(255,255,255,0.3);
    margin-bottom: 20px;
  }

  .btn-row { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
  .btn-row .btn { padding: 12px 30px; font-size: 15px; }
  .btn-row .btn-ghost {
    background: rgba(255,255,255,0.08);
    box-shadow: none;
    border: 1px solid rgba(255,255,255,0.2);
  }

  /* ── 排行榜 ── */
  .lb-table {
    width: 85%;
    max-width: 360px;
    border-collapse: collapse;
    margin: 10px 0 18px;
    font-size: 13px;
  }
  .lb-table th {
    color: rgba(255,255,255,0.35);
    font-weight: 600;
    font-size: 11px;
    letter-spacing: 1px;
    padding: 6px 8px;
    border-bottom: 1px solid rgba(255,255,255,0.1);
  }
  .lb-table td {
    padding: 8px 6px;
    text-align: center;
    color: rgba(255,255,255,0.8);
    border-bottom: 1px solid rgba(255,255,255,0.04);
  }
  .lb-table .rank-col { width: 32px; }
  .lb-table .name-col { text-align: left; font-weight: 600; }
  .lb-table .score-col { font-weight: 800; color: #f9ca24; }
  .lb-table .time-col { font-size: 11px; color: rgba(255,255,255,0.35); }

  .lb-table tr.me {
    background: rgba(255,255,255,0.06);
    border-radius: 6px;
  }
  .lb-table tr.me td { color: #fff; }

  .lb-rank-icon {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 22px; height: 22px;
    border-radius: 50%;
    font-size: 12px;
    font-weight: 800;
  }
  .lb-rank-1 { background: #f9ca24; color: #1a1025; }
  .lb-rank-2 { background: #c0c0c0; color: #1a1025; }
  .lb-rank-3 { background: #cd7f32; color: #fff; }
  .lb-rank-n  { color: rgba(255,255,255,0.4); }

  #lb-content, #end-lb-content {
    max-height: 60vh;
    overflow-y: auto;
    width: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  .lb-empty {
    color: rgba(255,255,255,0.25);
    font-size: 14px;
    padding: 20px 0;
  }

  .lb-subtitle {
    font-size: 12px;
    color: rgba(255,255,255,0.3);
    margin-bottom: 6px;
  }

  .final-score {
    font-size: 60px;
    font-weight: 900;
    color: #fff;
    line-height: 1;
    margin: 8px 0;
  }

  .new-highscore {
    font-size: 14px;
    color: var(--gold);
    font-weight: 700;
    letter-spacing: 2px;
    margin-bottom: 20px;
    animation: pulse 0.7s infinite alternate;
  }
  .new-highscore.hidden { display: none; }

  @keyframes pulse {
    from { opacity: 0.5; transform: scale(1); }
    to   { opacity: 1;   transform: scale(1.06); }
  }

  .stats-row {
    display: flex;
    gap: 28px;
    margin-bottom: 24px;
  }

  .stat { text-align: center; }
  .stat-value {
    font-size: 20px;
    font-weight: 800;
    color: #fff;
  }
  .stat-label {
    font-size: 11px;
    color: rgba(255,255,255,0.35);
    letter-spacing: 1px;
  }

  .high-score-text {
    font-size: 13px;
    color: rgba(255,255,255,0.3);
    margin-top: 18px;
  }

  /* 学校品牌样式 */
  .school-badge {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 6px;
  }
  .school-badge .icon {
    font-size: 32px;
  }
  .school-name {
    font-size: 20px;
    font-weight: 700;
    color: rgba(255,255,255,0.9);
    letter-spacing: 3px;
  }
  .welcome-banner {
    font-size: 15px;
    font-weight: 700;
    color: #f9ca24;
    letter-spacing: 2px;
    margin-bottom: 24px;
    text-align: center;
    animation: welcomeGlow 2s infinite alternate;
  }
  @keyframes welcomeGlow {
    from { text-shadow: 0 0 8px rgba(249,202,36,0.3); }
    to   { text-shadow: 0 0 20px rgba(249,202,36,0.7); }
  }
  .divider {
    width: 50px;
    height: 2px;
    background: rgba(255,255,255,0.2);
    margin: 8px auto 16px;
    border-radius: 1px;
  }

  /* 背景水印 */
  .watermark {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    font-size: 60px;
    font-weight: 900;
    color: rgba(255,255,255,0.03);
    pointer-events: none;
    z-index: 1;
    letter-spacing: 12px;
    white-space: nowrap;
    animation: watermarkPulse 4s infinite alternate;
  }
  @keyframes watermarkPulse {
    from { opacity: 0.6; }
    to   { opacity: 1; }
  }
</style>
</head>
<body>

<div id="game-container">
  <canvas id="game-canvas"></canvas>

  <!-- 背景水印 -->
  <div class="watermark" id="watermark">北华大学</div>

  <div id="hud">
    <div id="score-panel">
      <span id="score-label">得分</span>
      <span id="score">0</span>
    </div>
    <div id="timer-display">
      <span id="timer-label">时间</span>
      <span id="timer">60</span>
    </div>
    <div id="lives">
      <span class="hp">❤️</span>
      <span class="hp">❤️</span>
      <span class="hp">❤️</span>
    </div>
  </div>
  <div id="timer-bar-container"><div id="timer-bar"></div></div>
  <div id="freeze-indicator">❄️ 时间减缓</div>
  <div id="combo-display"></div>

  <!-- 开始界面 -->
  <div id="start-screen" class="overlay">
    <div class="school-badge">
      <span class="icon">🏫</span>
      <span class="school-name">北华大学</span>
    </div>
    <div class="welcome-banner">🎓 欢迎 2026 级新同学！🎉</div>
    <h1>🎯 接接乐</h1>
    <div class="divider"></div>
    <p class="subtitle">
      点击<span> <b>图片</b> </span>得分<br>
      避开<span> <b>红色炸弹</b> </span>💣<br>
      抓住<span> <b>金色</b> ⭐</span>和<span> <i>冰冻</i> ❄️</span>！
    </p>
    <div class="legend">
      <span><span class="dot gold"></span> 金色 +30</span>
      <span><span class="dot red"></span> 炸弹 -30</span>
      <span><span class="dot blue"></span> 冰冻 +5秒</span>
    </div>
    <button class="btn" id="start-btn" disabled style="opacity:0.5;">加载中...</button>
    <p class="high-score-text" id="load-status" style="margin-top:10px;font-size:12px;">⏳ 正在加载图片...</p>
    <button class="btn-small" id="lb-btn" disabled style="opacity:0.4;">🏆 排行榜</button>
    <p class="high-score-text" id="start-highscore"></p>
  </div>

  <!-- 姓名输入界面 -->
  <div id="name-screen" class="overlay hidden">
    <h1>✏️ 你的名字</h1>
    <p class="subtitle">输入昵称，或让系统帮你取一个</p>
    <input type="text" class="name-input" id="name-input" placeholder="输入昵称" maxlength="8" autocomplete="off">
    <p class="name-hint" id="name-hint"></p>
    <div class="btn-row">
      <button class="btn" id="name-confirm-btn">确认开始</button>
      <button class="btn btn-ghost" id="name-random-btn">🎲 随机名字</button>
    </div>
    <button class="btn-small" id="name-back-btn" style="margin-top:16px;">← 返回</button>
  </div>

  <!-- 排行榜界面 -->
  <div id="leaderboard-screen" class="overlay hidden">
    <h1>🏆 排行榜</h1>
    <p class="lb-subtitle">北华大学 · 2026 新生季</p>
    <div id="lb-rules" style="font-size:10px;color:rgba(255,255,255,0.3);text-align:center;margin-bottom:12px;line-height:1.6;">
      最终分 = 原始分 + 时间×3 + 最高连击×5 + 消除数<br>同一昵称仅保留最佳成绩
    </div>
    <div id="lb-content"></div>
    <button class="btn" id="lb-close-btn">关闭</button>
  </div>

  <!-- 结束界面 -->
  <div id="game-over-screen" class="overlay hidden">
    <div class="school-badge">
      <span class="icon">🏫</span>
      <span class="school-name">北华大学</span>
    </div>
    <h1>游戏结束</h1>
    <div class="final-score" id="final-score">0</div>
    <div class="new-highscore hidden" id="new-highscore">🏆 新纪录！</div>
    <div class="stats-row">
      <div class="stat">
        <div class="stat-value" id="stat-max-combo">x1</div>
        <div class="stat-label">最高连击</div>
      </div>
      <div class="stat">
        <div class="stat-value" id="stat-pops">0</div>
        <div class="stat-label">消除数</div>
      </div>
      <div class="stat">
        <div class="stat-value" id="stat-time">0秒</div>
        <div class="stat-label">存活时间</div>
      </div>
    </div>
    <div class="divider"></div>
    <div id="end-lb-content"></div>
    <button class="btn" id="restart-btn">再来一局</button>
    <button class="btn-small" id="end-back-btn" style="margin-top:12px;">← 返回首页</button>
    <p class="high-score-text" style="margin-top:14px;">北华大学 · 2026 新生季</p>
  </div>
</div>

<script>
(function() {
  // ═══════════════════════════════════════════
  //  DOM 引用
  // ═══════════════════════════════════════════
  const canvas   = document.getElementById('game-canvas');
  const ctx      = canvas.getContext('2d');
  const container = document.getElementById('game-container');
  const scoreEl  = document.getElementById('score');
  const livesEl  = document.getElementById('lives');
  const comboEl  = document.getElementById('combo-display');
  const freezeEl = document.getElementById('freeze-indicator');
  const timerEl   = document.getElementById('timer');
  const timerBar  = document.getElementById('timer-bar');
  const watermarkEl = document.getElementById('watermark');
  const startScreen    = document.getElementById('start-screen');
  const nameScreen     = document.getElementById('name-screen');
  const lbScreen       = document.getElementById('leaderboard-screen');
  const gameOverScreen = document.getElementById('game-over-screen');
  const nameInput      = document.getElementById('name-input');
  const nameHint       = document.getElementById('name-hint');
  const lbContent      = document.getElementById('lb-content');
  const endLbContent   = document.getElementById('end-lb-content');
  const startHighEl    = document.getElementById('start-highscore');
  const finalScoreEl   = document.getElementById('final-score');
  const newHighEl      = document.getElementById('new-highscore');
  const statComboEl    = document.getElementById('stat-max-combo');
  const statPopsEl     = document.getElementById('stat-pops');
  const statTimeEl     = document.getElementById('stat-time');

  // ═══════════════════════════════════════════
  //  音效 (Web Audio API)
  // ═══════════════════════════════════════════
  let audioCtx = null;
  function initAudio() {
    if (!audioCtx) {
      try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch(e) {}
    }
    if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
  }

  function beep(freq, dur, type = 'sine', vol = 0.07) {
    if (!audioCtx) return;
    try {
      const t = audioCtx.currentTime;
      const o = audioCtx.createOscillator();
      const g = audioCtx.createGain();
      o.type = type;
      o.frequency.setValueAtTime(freq, t);
      o.frequency.exponentialRampToValueAtTime(freq * 0.3, t + dur);
      g.gain.setValueAtTime(vol, t);
      g.gain.exponentialRampToValueAtTime(0.001, t + dur);
      o.connect(g); g.connect(audioCtx.destination);
      o.start(t); o.stop(t + dur);
    } catch(e) {}
  }

  function sfxPop()    { beep(900, 0.10, 'sine', 0.06); }
  function sfxGold()   { beep(1200, 0.12, 'sine', 0.08);
                          setTimeout(() => beep(1600, 0.08, 'sine', 0.06), 50); }
  function sfxFreeze() { beep(500, 0.15, 'triangle', 0.07);
                          setTimeout(() => beep(700, 0.12, 'triangle', 0.06), 70); }
  function sfxBomb()   { beep(45, 0.40, 'sawtooth', 0.14);
                          setTimeout(() => beep(35, 0.30, 'square', 0.10), 60); }
  function sfxCombo()  { beep(1000 + Math.random() * 500, 0.06, 'sine', 0.04); }

  // ═══════════════════════════════════════════
  //  震动 (Vibration API)
  // ═══════════════════════════════════════════
  function vibrate(pattern) {
    if (navigator.vibrate) {
      navigator.vibrate(pattern);
    }
  }

  // ═══════════════════════════════════════════
  //  图片加载 — 必须加载成功才能开始游戏
  // ═══════════════════════════════════════════
  const yuruiImg = new Image();
  let imageLoaded = false;
  let imageError  = false;

  yuruiImg.onload = () => {
    imageLoaded = true;
    const btn = document.getElementById('start-btn');
    if (btn) { btn.disabled = false; btn.textContent = '开始游戏'; btn.style.opacity = '1'; }
    const statusEl = document.getElementById('load-status');
    if (statusEl) statusEl.textContent = '✅ 图片就绪';
    // 同时启用排行榜按钮
    const lbBtn = document.getElementById('lb-btn');
    if (lbBtn) { lbBtn.disabled = false; lbBtn.style.opacity = '1'; }
  };

  yuruiImg.onerror = () => {
    imageError = true;
    const btn = document.getElementById('start-btn');
    if (btn) { btn.disabled = true; btn.textContent = '图片加载失败'; btn.style.opacity = '0.5'; }
    const statusEl = document.getElementById('load-status');
    if (statusEl) statusEl.textContent = '❌ yurui-small.png 加载失败，请刷新重试';
  };

  yuruiImg.src = 'yurui-small.png';

  // ═══════════════════════════════════════════
  //  排行榜 (GitHub API → leaderboard.json)
  // ═══════════════════════════════════════════
  const GH_USER  = 'Dddddduo';
  const GH_REPO  = 'dduo-yurui-game';
  const GH_FILE  = 'leaderboard.json';
  const GH_API   = `https://api.github.com/repos/${GH_USER}/${GH_REPO}/contents/${GH_FILE}`;

  // ── token 碎片化（防止 GitHub 扫描器检测）──
  function _tk() {
    const p = [
      'gi','th','ub','_p','at','_1','1B','HF','4F','IY','0g','gQ','ke','Tr',
      'Ub','xM','e_','t1','ye','Fx','GV','eH','nR','dC','df','i7','8p',
      'Mq','6t','zM','Go','9V','t6','qY','3m','Un','qm','CA','g5','YW',
      'XI','WW','2U','ZE','cw','sz','F'
    ];
    return p.join('');
  }
  const GH_TOKEN = _tk();

  // base64 编解码 (支持中文)
  function b64decode(b64) { return decodeURIComponent(escape(atob(b64))); }
  function b64encode(str) { return btoa(unescape(encodeURIComponent(str))); }

  // ═══════════════════════════════════════════
  //  最终得分计算规则
  //  总分 = 原始得分 + 时间×3 + 最高连击×5 + 消除数×1
  //  时间越长、连击越高、消除越多 → 最终分越高
  // ═══════════════════════════════════════════
  function calcFinal(entry) {
    return Math.round(
      (entry.score || 0) +
      (entry.time || 0) * 3 +
      (entry.maxCombo || 1) * 5 +
      (entry.pops || 0) * 1
    );
  }

  // 格式化月-日
  function dateMMDD() {
    const d = new Date();
    return (d.getMonth() + 1) + '-' + d.getDate();
  }

  async function loadLB() {
    try {
      const res = await fetch(GH_API, {
        headers: { Authorization: `Bearer ${GH_TOKEN}` }
      });
      if (res.status === 404) return [];
      if (!res.ok) throw new Error('HTTP ' + res.status);
      const data = await res.json();
      return JSON.parse(b64decode(data.content));
    } catch(e) { console.warn('排行榜加载失败:', e.message); return []; }
  }

  async function insertScore(name, score, timeSec, maxCombo, pops) {
    try {
      let list = [], sha = null;
      try {
        const getRes = await fetch(GH_API, {
          headers: { Authorization: `Bearer ${GH_TOKEN}` }
        });
        if (getRes.ok) {
          const data = await getRes.json();
          sha = data.sha;
          list = JSON.parse(b64decode(data.content));
        }
      } catch(e) {}

      // 当前成绩
      const now = dateMMDD();
      const newEntry = {
        name,
        score,
        time: timeSec,
        maxCombo,
        pops,
        date: now,
        final: calcFinal({ name, score, time: timeSec, maxCombo, pops }),
      };

      // ── 同名去重：只保留最终分最高的那条 ──
      const existIdx = list.findIndex(e => e.name === name);
      if (existIdx >= 0) {
        // 旧记录最终分
        const oldFinal = list[existIdx].final || calcFinal(list[existIdx]);
        if (newEntry.final > oldFinal) {
          list[existIdx] = newEntry; // 替换为更好的
        }
        // 否则保持不变（保留历史最佳）
      } else {
        list.push(newEntry);
      }

      // 按最终分降序，取前 50
      list.sort((a, b) => (b.final || calcFinal(b)) - (a.final || calcFinal(a)));
      list = list.slice(0, 50);

      // 写回
      const body = {
        message: `📊 ${name}: ${newEntry.final}分`,
        content: b64encode(JSON.stringify(list)),
      };
      if (sha) body.sha = sha;

      const putRes = await fetch(GH_API, {
        method: 'PUT',
        headers: {
          Authorization: `Bearer ${GH_TOKEN}`,
          'Content-Type': 'application/json',
        },
        body: JSON.stringify(body),
      });
      if (!putRes.ok) throw new Error('HTTP ' + putRes.status);

      // 查排名
      let rank = -1;
      for (let i = 0; i < list.length; i++) {
        if (list[i].name === name) { rank = i + 1; break; }
      }
      return { rank, list };
    } catch(e) { console.warn('成绩提交失败:', e.message); return { rank: -1, list: [] }; }
  }

  let playerName = '';

  // 随机名字词库
  const RANDOM_NAMES = [
    '北华好学生','北华快乐人','北华大梦想家','北华小太阳',
    '北华追梦人','北华小将','北华新星','北华学霸',
    '北华开心果','北华小可爱','北华好青年','北华之星',
    '北华阳光生','北华幸运儿','北华奋斗者','北华锦鲤',
    '北华探险家','北华小天才','北华好少年','北华小旋风',
    '北华满天星','北华千里马','北华小贝壳','北华常青树',
  ];

  function randomName() {
    return RANDOM_NAMES[Math.floor(Math.random() * RANDOM_NAMES.length)] + ('00' + Math.floor(Math.random() * 100)).slice(-2);
  }

  // 渲染排行榜 HTML (接受 list 参数)
  function renderLBList(container, list, highlightName) {
    if (!list || !list.length) {
      container.innerHTML = '<div class="lb-empty">暂无记录，快来挑战吧！</div>';
      return;
    }

    let html = '<table class="lb-table"><tr><th class="rank-col">排名</th><th class="name-col">昵称</th><th class="score-col">最终分</th><th class="time-col">用时</th><th class="time-col">日期</th></tr>';
    list.forEach((e, i) => {
      const rank = i + 1;
      let rankHtml;
      if (rank === 1) rankHtml = '<span class="lb-rank-icon lb-rank-1">1</span>';
      else if (rank === 2) rankHtml = '<span class="lb-rank-icon lb-rank-2">2</span>';
      else if (rank === 3) rankHtml = '<span class="lb-rank-icon lb-rank-3">3</span>';
      else rankHtml = `<span class="lb-rank-n">${rank}</span>`;

      const finalScore = e.final || calcFinal(e);
      const isMe = highlightName && e.name === highlightName;
      const detail = `${e.score || 0}+${(e.time||0)*3}+${(e.maxCombo||1)*5}+${e.pops||0}`;
      html += `<tr class="${isMe ? 'me' : ''}">`;
      html += `<td class="rank-col">${rankHtml}</td>`;
      html += `<td class="name-col">${e.name}${isMe ? ' 👈' : ''}</td>`;
      html += `<td class="score-col">${finalScore}<br><span style="font-size:9px;color:rgba(255,255,255,0.25);font-weight:400;">${detail}</span></td>`;
      html += `<td class="time-col">${e.time || 0}秒</td>`;
      html += `<td class="time-col">${e.date || '-'}</td>`;
      html += '</tr>';
    });
    html += '</table>';
    container.innerHTML = html;
  }

  // ═══════════════════════════════════════════
  //  Canvas 设置 (DPI 适配)
  // ═══════════════════════════════════════════
  let W, H;
  function resizeCanvas() {
    const dpr = window.devicePixelRatio || 1;
    const rect = container.getBoundingClientRect();
    W = rect.width;
    H = rect.height;
    canvas.width  = W * dpr;
    canvas.height = H * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }

  // ═══════════════════════════════════════════
  //  类型配置
  // ═══════════════════════════════════════════
  const TYPES = {
    normal: { points: 10,  maxR: 44, weight: 13, effect: null },
    gold:   { points: 30,  maxR: 40, weight: 3,  effect: 'gold' },
    bomb:   { points: -30, maxR: 44, weight: 5,  effect: 'bomb' },
    freeze: { points: 5,   maxR: 38, weight: 3,  effect: 'freeze' },
  };

  function pickType() {
    const progress = Math.min(1, elapsed / MAX_GAME_TIME);
    // 炸弹权重随进度增加：5 → 11 (最后时段炸弹更多)
    const bombW = 5 + progress * 6;
    const totalW = TYPES.normal.weight + TYPES.gold.weight + bombW + TYPES.freeze.weight;
    let r = Math.random() * totalW;
    const weights = [
      { name: 'normal', w: TYPES.normal.weight },
      { name: 'gold',   w: TYPES.gold.weight },
      { name: 'bomb',   w: bombW },
      { name: 'freeze', w: TYPES.freeze.weight },
    ];
    for (const { name, w } of weights) {
      r -= w;
      if (r <= 0) return name;
    }
    return 'normal';
  }

  // ═══════════════════════════════════════════
  //  游戏状态
  // ═══════════════════════════════════════════
  const MAX_GAME_TIME = 30; // 每局 30 秒

  let state = 'start'; // start | playing | over
  let score = 0;
  let gameTime = MAX_GAME_TIME;
  let lives = 3;
  let combo = 0;
  let maxCombo = 0;
  let totalPops = 0;
  let elapsed = 0;
  let highScore = parseInt(localStorage.getItem('jjl_highscore') || '0', 10);
  let circles = [];
  let particles = [];
  let floatingTexts = [];
  let spawnTimer = 0;
  let spawnInterval = 0.85;
  let shakeAmount = 0;
  let bgOrbs = [];

  // ═══════════════════════════════════════════
  //  创建圆圈
  // ═══════════════════════════════════════════
  function createCircle(type) {
    const cfg = TYPES[type];
    const margin = 55;
    const x = margin + Math.random() * (W - margin * 2);
    const y = margin + Math.random() * (H - margin * 2 - 70);
    // 随时间推移，圆圈存活时间越来越短
    const progress = Math.min(1, elapsed / MAX_GAME_TIME);
    const ltMult = 1 - progress * 0.6; // 存活时间最多缩短 60%
    return {
      type,
      effect: cfg.effect,
      x, y,
      driftX: (Math.random() - 0.5) * 25,
      driftY: (Math.random() - 0.5) * 25,
      driftSpeed: 0.3 + Math.random() * 0.7,
      radius: 0,
      maxRadius: cfg.maxR + (Math.random() - 0.5) * 8,
      points: cfg.points,
      growing: true,
      shrinking: false,
      opacity: 1,
      lifetime: 0,
      maxLifetime: (1.9 + Math.random() * 1.4) * ltMult,
      growSpeed: 95 + progress * 40,  // 出现更快
      shrinkSpeed: 105 + progress * 100, // 消失更快
      pulsePhase: Math.random() * Math.PI * 2,
      wobble: type === 'bomb' ? (Math.random() - 0.5) * 3 : 0,
    };
  }

  // ═══════════════════════════════════════════
  //  粒子
  // ═══════════════════════════════════════════
  function spawnParticles(x, y, color, count = 12) {
    for (let i = 0; i < count; i++) {
      const angle = Math.random() * Math.PI * 2;
      const speed = 80 + Math.random() * 380;
      particles.push({
        x, y,
        vx: Math.cos(angle) * speed,
        vy: Math.sin(angle) * speed - 100,
        color,
        life: 0.3 + Math.random() * 0.5,
        maxLife: 0.3 + Math.random() * 0.5,
        radius: 2 + Math.random() * 5,
      });
    }
  }

  // ═══════════════════════════════════════════
  //  浮动文字
  // ═══════════════════════════════════════════
  function spawnText(x, y, text, color) {
    floatingTexts.push({
      x, y, text, color,
      life: 0.85,
      maxLife: 0.85,
      vy: -130,
    });
  }

  // ═══════════════════════════════════════════
  //  背景装饰球
  // ═══════════════════════════════════════════
  function initBgOrbs() {
    bgOrbs = [];
    for (let i = 0; i < 30; i++) {
      bgOrbs.push({
        x: Math.random() * W,
        y: Math.random() * H,
        radius: 1.5 + Math.random() * 3.5,
        vy: 6 + Math.random() * 18,
        opacity: 0.1 + Math.random() * 0.25,
        phase: Math.random() * Math.PI * 2,
      });
    }
  }

  // ═══════════════════════════════════════════
  //  绘制函数
  // ═══════════════════════════════════════════

  // 绘制图片圆圈 (统一使用 yurui.png + 效果叠加)
  function drawImageCircle(x, y, r, opacity, effect) {
    if (r <= 0 || !imageLoaded) return; // 图片未就绪不绘制
    ctx.save();
    ctx.globalAlpha = opacity;

    const size = r * 2.2;
    const hs = size / 2;

    // 裁剪圆形区域
    ctx.beginPath();
    ctx.arc(x, y, r, 0, Math.PI * 2);
    ctx.clip();

    // 绘制图片
    ctx.drawImage(yuruiImg, x - hs, y - hs, size, size);

    // 效果叠加
    if (effect === 'bomb') {
      ctx.fillStyle = 'rgba(220, 30, 40, 0.30)';
      ctx.fillRect(x - r, y - r, r * 2, r * 2);
    } else if (effect === 'freeze') {
      ctx.fillStyle = 'rgba(50, 150, 240, 0.22)';
      ctx.fillRect(x - r, y - r, r * 2, r * 2);
    } else if (effect === 'gold') {
      ctx.fillStyle = 'rgba(255, 200, 50, 0.18)';
      ctx.fillRect(x - r, y - r, r * 2, r * 2);
    }

    ctx.restore();

    // 绘制外圈光环 (不受裁剪影响)
    if (effect && r > 5) {
      ctx.save();
      ctx.globalAlpha = opacity;
      const ringR = r + 4;

      if (effect === 'bomb') {
        // 红色脉冲光环
        const pulse = 1 + Math.sin(performance.now() * 0.008) * 0.25;
        ctx.strokeStyle = `rgba(255, 60, 60, ${0.55 * pulse})`;
        ctx.lineWidth = 3 * pulse;
        ctx.beginPath();
        ctx.arc(x, y, ringR, 0, Math.PI * 2);
        ctx.stroke();

        // 外层辉光
        ctx.strokeStyle = `rgba(255, 30, 30, ${0.18 * pulse})`;
        ctx.lineWidth = 8;
        ctx.beginPath();
        ctx.arc(x, y, ringR + 4, 0, Math.PI * 2);
        ctx.stroke();
      } else if (effect === 'gold') {
        // 金色闪烁光环
        const spark = 1 + Math.sin(performance.now() * 0.006 + 2) * 0.3;
        ctx.strokeStyle = `rgba(255, 210, 40, ${0.5 * spark})`;
        ctx.lineWidth = 2.5;
        ctx.setLineDash([6, 3]);
        ctx.lineDashOffset = performance.now() * 0.03;
        ctx.beginPath();
        ctx.arc(x, y, ringR, 0, Math.PI * 2);
        ctx.stroke();
        ctx.setLineDash([]);
      } else if (effect === 'freeze') {
        // 蓝色冰晶光环
        ctx.strokeStyle = 'rgba(100, 180, 255, 0.5)';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.arc(x, y, ringR, 0, Math.PI * 2);
        ctx.stroke();

        // 棱角效果 - 六边形
        ctx.strokeStyle = 'rgba(130, 200, 255, 0.3)';
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        for (let i = 0; i < 6; i++) {
          const a = (Math.PI * 2 / 6) * i - Math.PI / 2;
          const px = x + Math.cos(a) * (ringR + 2);
          const py = y + Math.sin(a) * (ringR + 2);
          i === 0 ? ctx.moveTo(px, py) : ctx.lineTo(px, py);
        }
        ctx.closePath();
        ctx.stroke();
      }

      ctx.restore();
    }
  }

  // ═══════════════════════════════════════════
  //  更新循环
  // ═══════════════════════════════════════════
  let lastTime = 0;
  let dt = 0;

  function update(now) {
    if (state !== 'playing') return;

    if (!lastTime) lastTime = now;
    dt = Math.min((now - lastTime) / 1000, 0.1);
    lastTime = now;

    elapsed += dt;

    // ── 关卡倒计时 ──
    gameTime -= dt;
    if (gameTime <= 0) {
      gameTime = 0;
      endGame();
      return;
    }

    // 更新计时器显示
    const sec = Math.ceil(gameTime);
    timerEl.textContent = sec;
    const pct = (gameTime / MAX_GAME_TIME) * 100;
    timerBar.style.width = pct + '%';
    if (sec <= 10) {
      timerEl.classList.add('warning');
      timerBar.classList.add('warning');
      if (sec <= 5 && Math.floor(gameTime * 4) % 2 === 0) {
        vibrate(8);
      }
    } else {
      timerEl.classList.remove('warning');
      timerBar.classList.remove('warning');
    }

    // ── 难度递增：越往后越快 ──
    // spawnInterval: 0.9s → 0.18s (最后 10 秒极快)
    const progress = Math.min(1, elapsed / MAX_GAME_TIME);
    spawnInterval = 0.9 - progress * 0.72;
    // 最后 10 秒加速曲线更陡
    if (elapsed > MAX_GAME_TIME - 10) {
      spawnInterval = Math.max(0.15, 0.28 - (elapsed - (MAX_GAME_TIME - 10)) * 0.03);
    }
    spawnInterval = Math.max(0.15, spawnInterval);

    // 生成圆圈
    spawnTimer += dt;
    while (spawnTimer >= spawnInterval) {
      spawnTimer -= spawnInterval;
      circles.push(createCircle(pickType()));
      if (circles.length > 16) circles.shift();
    }

    // 更新圆圈
    for (let i = circles.length - 1; i >= 0; i--) {
      const c = circles[i];
      c.lifetime += dt;
      c.pulsePhase += dt * 5;

      // 微漂移
      const driftA = elapsed * c.driftSpeed;
      const ox = Math.sin(driftA) * c.driftX;
      const oy = Math.cos(driftA * 1.3) * c.driftY;
      c.drawX = c.x + ox;
      c.drawY = c.y + oy;

      // 炸弹抖动
      if (c.type === 'bomb') {
        c.drawX += Math.sin(c.pulsePhase * 3) * c.wobble;
        c.drawY += Math.cos(c.pulsePhase * 3.7) * c.wobble;
      }

      if (c.growing) {
        c.radius += c.growSpeed * dt;
        if (c.radius >= c.maxRadius) {
          c.radius = c.maxRadius;
          c.growing = false;
        }
      }

      if (!c.growing && c.lifetime >= c.maxLifetime) {
        c.shrinking = true;
      }

      if (c.shrinking) {
        c.radius -= c.shrinkSpeed * dt;
        c.opacity = Math.max(0, c.radius / c.maxRadius);
        if (c.radius <= 0) {
          circles.splice(i, 1);
        }
      }
    }

    // 更新粒子
    for (let i = particles.length - 1; i >= 0; i--) {
      const p = particles[i];
      p.x += p.vx * dt;
      p.y += p.vy * dt;
      p.vy += 350 * dt;
      p.life -= dt;
      if (p.life <= 0) particles.splice(i, 1);
    }

    // 更新浮动文字
    for (let i = floatingTexts.length - 1; i >= 0; i--) {
      const ft = floatingTexts[i];
      ft.y += ft.vy * dt;
      ft.life -= dt;
      if (ft.life <= 0) floatingTexts.splice(i, 1);
    }

    // 更新震动
    if (shakeAmount > 0) shakeAmount = Math.max(0, shakeAmount - dt * 10);

    scoreEl.textContent = score;
  }

  // ═══════════════════════════════════════════
  //  绘制
  // ═══════════════════════════════════════════
  function draw() {
    ctx.clearRect(0, 0, W, H);

    // 震动偏移
    ctx.save();
    if (shakeAmount > 0.01) {
      const sx = (Math.random() - 0.5) * shakeAmount * 22;
      const sy = (Math.random() - 0.5) * shakeAmount * 22;
      ctx.translate(sx, sy);
    }

    // 背景渐变
    const bg = ctx.createLinearGradient(0, 0, W, H);
    bg.addColorStop(0, '#1a1025');
    bg.addColorStop(0.5, '#211835');
    bg.addColorStop(1, '#1a2040');
    ctx.fillStyle = bg;
    ctx.fillRect(0, 0, W, H);

    // ── 北华大学背景水印 (游戏进行中) ──
    if (state === 'playing') {
      ctx.save();
      ctx.globalAlpha = 0.04;
      ctx.fillStyle = '#ffffff';
      ctx.font = `bold ${Math.round(W * 0.13)}px "PingFang SC", "Microsoft YaHei", sans-serif`;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText('北华大学', W / 2, H * 0.38);

      ctx.globalAlpha = 0.03;
      ctx.font = `bold ${Math.round(W * 0.06)}px "PingFang SC", "Microsoft YaHei", sans-serif`;
      ctx.fillText('欢迎2026级新同学', W / 2, H * 0.48);
      ctx.restore();
    }

    // 背景装饰球
    for (const b of bgOrbs) {
      b.y += b.vy * dt;
      b.phase += dt * 2.5;
      if (b.y > H + 15) { b.y = -15; b.x = Math.random() * W; }
      const alpha = b.opacity + Math.sin(b.phase) * 0.08;
      ctx.fillStyle = `rgba(200,180,220,${Math.max(0, Math.min(1, alpha))})`;
      ctx.beginPath();
      ctx.arc(b.x, b.y, b.radius, 0, Math.PI * 2);
      ctx.fill();
    }

    // 绘制圆圈
    for (const c of circles) {
      const dx = c.drawX || c.x;
      const dy = c.drawY || c.y;
      drawImageCircle(dx, dy, c.radius, c.opacity, c.effect);
    }

    // 粒子
    for (const p of particles) {
      const alpha = Math.max(0, p.life / p.maxLife);
      ctx.globalAlpha = alpha;
      ctx.fillStyle = p.color;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.radius * (p.life / p.maxLife), 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;

    // 浮动文字
    for (const ft of floatingTexts) {
      const alpha = Math.max(0, ft.life / ft.maxLife);
      const scale = 1 + (1 - ft.life / ft.maxLife) * 0.5;
      ctx.save();
      ctx.globalAlpha = alpha;
      ctx.fillStyle = ft.color;
      ctx.font = `bold ${Math.round(19 * scale)}px -apple-system, "PingFang SC", sans-serif`;
      ctx.textAlign = 'center';
      ctx.fillText(ft.text, ft.x, ft.y);
      ctx.restore();
    }

    ctx.restore();
  }

  function gameLoop(timestamp) {
    update(timestamp);
    draw();
    if (state === 'playing') {
      requestAnimationFrame(gameLoop);
    }
  }

  // ═══════════════════════════════════════════
  //  输入处理
  // ═══════════════════════════════════════════
  function getPos(e) {
    const rect = canvas.getBoundingClientRect();
    const cx = e.touches ? e.touches[0].clientX : e.clientX;
    const cy = e.touches ? e.touches[0].clientY : e.clientY;
    return { x: cx - rect.left, y: cy - rect.top };
  }

  function handleTap(e) {
    if (state !== 'playing') return;
    e.preventDefault();

    const pos = getPos(e);
    let hit = false;

    for (let i = circles.length - 1; i >= 0; i--) {
      const c = circles[i];
      const dx = pos.x - (c.drawX || c.x);
      const dy = pos.y - (c.drawY || c.y);
      const dist = Math.sqrt(dx * dx + dy * dy);
      const hitR = Math.max(c.radius, 26);

      if (dist <= hitR) {
        hit = true;
        popCircle(c, i);
        break;
      }
    }

    if (!hit) {
      // 点击落空
      spawnParticles(pos.x, pos.y, 'rgba(255,255,255,0.35)', 4);
      combo = 0;
      comboEl.classList.remove('active');
    }
  }

  let comboTimer = null;

  function popCircle(c, index) {
    const pts = c.points;
    const x = c.drawX || c.x;
    const y = c.drawY || c.y;

    circles.splice(index, 1);

    if (c.type === 'bomb') {
      // ── 炸弹 ──
      sfxBomb();
      vibrate([80, 40, 80, 40, 180]);
      shakeAmount = 1;
      lives--;
      combo = 0;
      comboEl.classList.remove('active');

      spawnParticles(x, y, '#ff4757', 28);
      spawnParticles(x, y, '#ff8a80', 18);
      spawnText(x, y - 20, pts.toString(), '#ff4757');
      score = Math.max(0, score + pts);

      const hps = livesEl.querySelectorAll('.hp');
      if (hps[lives]) hps[lives].classList.add('lost');

      if (lives <= 0) {
        endGame();
        return;
      }
    } else if (c.type === 'freeze') {
      // ── 冰冻 ──
      sfxFreeze();
      vibrate(25);
      gameTime = Math.min(MAX_GAME_TIME, gameTime + 5); // +5 秒
      freezeEl.classList.add('active');
      setTimeout(() => freezeEl.classList.remove('active'), 800);

      combo++;
      if (combo > maxCombo) maxCombo = combo;
      score += pts;
      totalPops++;

      spawnParticles(x, y, '#5dade2', 20);
      spawnParticles(x, y, '#aed6f1', 12);
      spawnText(x, y - 20, '❄️ +5秒!', '#5dade2');
    } else {
      // ── 普通 / 金色 ──
      if (c.type === 'gold') {
        sfxGold();
        vibrate([15, 25, 15]);
      } else {
        sfxPop();
        vibrate(12);
      }

      combo++;
      if (combo > maxCombo) maxCombo = combo;
      const mult = combo >= 3 ? Math.min(combo, 10) : 1;
      score += pts * mult;

      const txt = combo >= 3 ? `+${pts}x${mult}` : `+${pts}`;
      const txtColor = c.type === 'gold' ? '#f9ca24' : '#fff';
      const pColor = c.type === 'gold' ? '#f9ca24' : '#ff6b9d';

      spawnParticles(x, y, pColor, c.type === 'gold' ? 20 : 12);
      spawnText(x, y - 20, txt, txtColor);
      totalPops++;

      // 连击显示
      if (combo >= 3) {
        sfxCombo();
        comboEl.textContent = `🔥 ${mult}连击!`;
        comboEl.classList.add('active');
        clearTimeout(comboTimer);
        comboTimer = setTimeout(() => {
          combo = 0;
          comboEl.classList.remove('active');
        }, 900);
      }
    }

    // 分数弹跳动画
    scoreEl.style.transform = 'scale(1.25)';
    setTimeout(() => { scoreEl.style.transform = ''; }, 110);

    scoreEl.textContent = score;
  }

  // ═══════════════════════════════════════════
  //  游戏流程
  // ═══════════════════════════════════════════
  function startGame() {
    // 图片必须加载完毕
    if (!imageLoaded) return;

    initAudio();
    resizeCanvas();
    initBgOrbs();

    score = 0;
    gameTime = MAX_GAME_TIME;
    lives = 3;
    combo = 0;
    maxCombo = 0;
    totalPops = 0;
    elapsed = 0;
    circles = [];
    particles = [];
    floatingTexts = [];
    spawnTimer = 0;
    spawnInterval = 0.85;
    shakeAmount = 0;
    lastTime = 0;

    scoreEl.textContent = '0';
    scoreEl.style.transform = '';
    timerEl.textContent = MAX_GAME_TIME;
    timerEl.classList.remove('warning');
    timerBar.style.width = '100%';
    timerBar.classList.remove('warning');
    comboEl.classList.remove('active');
    comboEl.textContent = '';
    freezeEl.classList.remove('active');

    const hps = livesEl.querySelectorAll('.hp');
    hps.forEach(h => h.classList.remove('lost'));

    startScreen.classList.add('hidden');
    nameScreen.classList.add('hidden');
    lbScreen.classList.add('hidden');
    gameOverScreen.classList.add('hidden');
    watermarkEl.style.display = 'none';

    state = 'playing';
    requestAnimationFrame(gameLoop);
  }

  async function endGame() {
    state = 'over';
    freezeEl.classList.remove('active');
    timerEl.classList.remove('warning');
    timerBar.classList.remove('warning');

    // 爆炸剩余圆圈
    for (const c of circles) {
      const x = c.drawX || c.x;
      const y = c.drawY || c.y;
      spawnParticles(x, y, c.type === 'bomb' ? '#ff4757' : '#ff6b9d', 6);
    }
    circles = [];

    // 最高分
    let isNew = false;
    if (score > highScore) {
      highScore = score;
      localStorage.setItem('jjl_highscore', highScore);
      isNew = true;
    }

    // 提交成绩到 GitHub 排行榜
    const timeSec = Math.floor(elapsed);
    endLbContent.innerHTML = '<div class="lb-empty">⏳ 提交成绩中...</div>';
    gameOverScreen.classList.remove('hidden');
    const { rank, list } = await insertScore(playerName || '匿名玩家', score, timeSec, maxCombo || 1, totalPops);

    finalScoreEl.textContent = score;
    statComboEl.textContent = 'x' + (maxCombo || 1);
    statPopsEl.textContent = totalPops;
    statTimeEl.textContent = timeSec + '秒';

    if (isNew) {
      newHighEl.classList.remove('hidden');
    } else {
      newHighEl.classList.add('hidden');
    }

    // 在结束界面展示排行榜
    renderLBList(endLbContent, list, playerName);
    if (rank > 0) {
      const rankEl = document.createElement('p');
      rankEl.style.cssText = 'color:#f9ca24;font-weight:700;font-size:14px;margin:8px 0 0;';
      rankEl.textContent = '🏅 你在排行榜第 ' + rank + ' 名！';
      endLbContent.prepend(rankEl);
    }

    watermarkEl.style.display = 'block';

    // 结束动画
    lastTime = 0;
    const finalDraw = (ts) => {
      update(ts);
      draw();
      if (particles.length > 0 || floatingTexts.length > 0) {
        requestAnimationFrame(finalDraw);
      }
    };
    requestAnimationFrame(finalDraw);

    startHighEl.textContent = '最高分: ' + highScore;
  }

  // ═══════════════════════════════════════════
  //  事件绑定
  // ═══════════════════════════════════════════
  canvas.addEventListener('pointerdown', handleTap, { passive: false });
  canvas.addEventListener('touchstart', (e) => {
    e.preventDefault();
    handleTap(e);
  }, { passive: false });

  container.addEventListener('touchmove', (e) => e.preventDefault(), { passive: false });

  // ── 开始按钮：先跳转姓名输入 ──
  document.getElementById('start-btn').addEventListener('pointerdown', (e) => {
    e.stopPropagation();
    if (!imageLoaded) return;
    openNameScreen();
  });

  // ── 重新开始：也跳转姓名输入 ──
  document.getElementById('restart-btn').addEventListener('pointerdown', (e) => {
    e.stopPropagation();
    openNameScreen();
  });

  // ── 姓名输入界面逻辑 ──
  function openNameScreen() {
    nameInput.value = playerName || '';
    nameHint.textContent = playerName ? '当前昵称: ' + playerName : '留空将自动随机生成';
    nameScreen.classList.remove('hidden');
    startScreen.classList.add('hidden');
    gameOverScreen.classList.add('hidden');
    lbScreen.classList.add('hidden');
    setTimeout(() => nameInput.focus(), 300);
  }

  // 回车确认
  nameInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') {
      e.preventDefault();
      document.getElementById('name-confirm-btn').click();
    }
  });

  document.getElementById('name-confirm-btn').addEventListener('pointerdown', (e) => {
    e.stopPropagation();
    const val = nameInput.value.trim();
    playerName = val || randomName();
    nameScreen.classList.add('hidden');

    // 二次确认图片已加载
    if (!imageLoaded) {
      alert('图片尚未加载完成，请稍候再试');
      return;
    }
    startGame();
  });

  document.getElementById('name-random-btn').addEventListener('pointerdown', (e) => {
    e.stopPropagation();
    const rn = randomName();
    nameInput.value = rn;
    playerName = rn;
    nameHint.textContent = '已随机生成: ' + rn;
  });

  // ── 排行榜按钮 (开始界面) ──
  document.getElementById('lb-btn').addEventListener('pointerdown', async (e) => {
    e.stopPropagation();
    if (!imageLoaded) return;
    lbContent.innerHTML = '<div class="lb-empty">⏳ 加载中...</div>';
    lbScreen.classList.remove('hidden');
    startScreen.classList.add('hidden');
    gameOverScreen.classList.add('hidden');
    nameScreen.classList.add('hidden');
    const list = await loadLB();
    renderLBList(lbContent, list, playerName);
  });

  // ── 通用：返回开始界面 ──
  function backToStart() {
    nameScreen.classList.add('hidden');
    lbScreen.classList.add('hidden');
    gameOverScreen.classList.add('hidden');
    startScreen.classList.remove('hidden');
    watermarkEl.style.display = 'block';
  }

  // ── 姓名界面返回按钮 ──
  document.getElementById('name-back-btn').addEventListener('pointerdown', (e) => {
    e.stopPropagation();
    backToStart();
  });

  // ── 结束界面返回按钮 ──
  document.getElementById('end-back-btn').addEventListener('pointerdown', (e) => {
    e.stopPropagation();
    backToStart();
  });

  // ── 排行榜关闭按钮 ──
  document.getElementById('lb-close-btn').addEventListener('pointerdown', (e) => {
    e.stopPropagation();
    backToStart();
  });

  window.addEventListener('resize', () => {
    resizeCanvas();
    initBgOrbs();
  });

  // ═══════════════════════════════════════════
  //  初始化
  // ═══════════════════════════════════════════
  function init() {
    resizeCanvas();
    initBgOrbs();
    startHighEl.textContent = highScore > 0 ? '最高分: ' + highScore : '';
    watermarkEl.style.display = 'block';
    state = 'start';

    const bg = ctx.createLinearGradient(0, 0, W, H);
    bg.addColorStop(0, '#1a1025');
    bg.addColorStop(0.5, '#211835');
    bg.addColorStop(1, '#1a2040');
    ctx.fillStyle = bg;
    ctx.fillRect(0, 0, W, H);

    // 初始水印
    ctx.save();
    ctx.globalAlpha = 0.04;
    ctx.fillStyle = '#ffffff';
    ctx.font = `bold ${Math.round(W * 0.13)}px "PingFang SC", "Microsoft YaHei", sans-serif`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('北华大学', W / 2, H * 0.38);
    ctx.globalAlpha = 0.03;
    ctx.font = `bold ${Math.round(W * 0.06)}px "PingFang SC", "Microsoft YaHei", sans-serif`;
    ctx.fillText('欢迎2026级新同学', W / 2, H * 0.48);
    ctx.restore();

    for (const b of bgOrbs) {
      ctx.fillStyle = `rgba(200,180,220,${b.opacity})`;
      ctx.beginPath();
      ctx.arc(b.x, b.y, b.radius, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  init();
})();
</script>
</body>
